services:
  mysql:
    image: mysql:8.0
    container_name: signalboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: signalboard
      MYSQL_DATABASE: signalboard
    ports:
      - "3306:3306"
    volumes:
      - signalboard_mysql:/var/lib/mysql

volumes:
  signalboard_mysql:
